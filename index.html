
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple weather app showing current conditions.">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Weather App</h1>

    <form class="search" id="search-form">
      <label class="sr-only" for="city-input">City name</label>
      <input
        id="city-input"
        type="text"
        placeholder="Enter a city (e.g. Ibadan)"
        autocomplete="off"
        required
      >
      <button id="search-button" type="submit">Search</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">
      Search for a city to see its weather.
    </p>

    <section class="weather" id="weather-panel" hidden>
      <div class="weather-symbol" id="weather-symbol">🌤️</div>
      <p class="condition" id="condition">Current conditions</p>
      <h2 class="temp" id="temperature">--°C</h2>
      <h3 class="city" id="city-name">City</h3>
      <p class="updated" id="updated"></p>

      <div class="details">
        <div class="detail-card">
          <span class="detail-icon">💧</span>
          <div>
            <p class="detail-value" id="humidity">--%</p>
            <p class="detail-label">Humidity</p>
          </div>
        </div>

        <div class="detail-card">
          <span class="detail-icon">💨</span>
          <div>
            <p class="detail-value" id="wind">-- km/h</p>
            <p class="detail-label">Wind speed</p>
          </div>
        </div>

        <div class="detail-card">
          <span class="detail-icon">🌡️</span>
          <div>
            <p class="detail-value" id="feels-like">--°C</p>
            <p class="detail-label">Feels like</p>
          </div>
        </div>
      </div>
    </section>

    <footer>Weather data provided by Allison-Tech</footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>

</html>
